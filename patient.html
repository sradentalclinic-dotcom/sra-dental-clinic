<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRA Dental Dabwali | Luxury Boutique Dental & Implant Centre</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FDFBF7;
      --card-bg: #FFFFFF;
      --gold-primary: #A88238;
      --gold-dark: #8C6D2D;
      --text-dark: #1C1917;
      --text-muted: #78716C;
      --border-gold: rgba(168, 130, 56, 0.22);
      --accent-soft: #F5EFE6;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-cream); color: var(--text-dark); margin: 0; padding: 0; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: rgba(255, 255, 255, 0.95); border-bottom: 1px solid var(--border-gold); position: sticky; top: 0; z-index: 1000; }
    .brand-title { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 700; color: var(--gold-primary); letter-spacing: 3px; text-decoration: none; }
    .nav-links a { margin-left: 25px; text-decoration: none; color: var(--text-dark); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .hero { text-align: center; padding: 100px 20px 80px; background: linear-gradient(180deg, #FFFFFF 0%, var(--bg-cream) 100%); border-bottom: 1px solid var(--border-gold); }
    .hero h1 { font-family: 'Cinzel', serif; font-size: 48px; color: var(--gold-primary); margin: 0 0 15px; letter-spacing: 4px; }
    .section { padding: 80px 8%; }
    .section-title { font-family: 'Cinzel', serif; text-align: center; font-size: 32px; color: var(--gold-primary); margin-bottom: 10px; letter-spacing: 2px; }
    .booking-wrapper { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border-gold); box-shadow: 0 10px 30px rgba(168, 130, 56, 0.08); }
    label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: block; margin-top: 16px; }
    input, select { width: 100%; padding: 14px; margin-top: 6px; background: #FAF9F6; border: 1px solid var(--border-gold); color: var(--text-dark); border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
    button.submit-btn { width: 100%; margin-top: 25px; background: var(--text-dark); color: #FFF; border: 1px solid var(--gold-primary); padding: 16px; border-radius: 6px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
    button.submit-btn:hover { background: var(--gold-primary); }
    footer { text-align: center; padding: 30px; background: var(--text-dark); color: #FFF; font-size: 12px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="#" class="brand-title">SRA DENTAL</a>
    <div class="nav-links">
      <a href="#booking">Book Appointment</a>
    </div>
  </nav>

  <section class="hero">
    <h1>SRA DENTAL DABWALI</h1>
    <p>Luxury Boutique Dental & Implant Centre. Experience painless root canals, advanced implants, and precision care.</p>
  </section>

  <section class="section" id="booking">
    <h2 class="section-title">Book An Appointment</h2>
    <div class="booking-wrapper">
      <label>Your Full Name</label>
      <input type="text" id="custName" placeholder="e.g. Rahul Kumar">

      <label>Phone Number</label>
      <input type="tel" id="custPhone" placeholder="e.g. 7015070153">

      <label>Select Treatment</label>
      <select id="custProc"></select>

      <label>Preferred Date</label>
      <input type="date" id="custDate">

      <label>Time Slot</label>
      <select id="custTime">
        <option value="10:00 AM">10:00 AM</option>
        <option value="11:00 AM">11:00 AM</option>
        <option value="12:00 PM">12:00 PM</option>
        <option value="01:00 PM">01:00 PM</option>
        <option value="04:30 PM">04:30 PM</option>
        <option value="05:30 PM">05:30 PM</option>
        <option value="06:30 PM">06:30 PM</option>
      </select>

      <label>How did you find us?</label>
      <select id="custSource">
        <option value="Website">Website</option>
        <option value="Instagram Reel">Instagram Reel</option>
      </select>

      <button class="submit-btn" onclick="submitPublicBooking()">Confirm Booking Request</button>
      <div id="bookingStatus" style="margin-top:15px; text-align:center; font-weight:bold; color:var(--gold-dark);"></div>
    </div>
  </section>

  <footer>© SRA Dental Clinic, Mandi Dabwali. All Rights Reserved.</footer>

  <script>
    const API_URL = "";

    window.onload = function() {
      loadProceduresForPublic();
      document.getElementById('custDate').valueAsDate = new Date();
    };

    async function loadProceduresForPublic() {
      const res = await fetch(`${API_URL}/procedures`);
      const data = await res.json();
      const select = document.getElementById('custProc');
      select.innerHTML = '<option value="">-- Choose Treatment --</option>';
      data.forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.name} (₹${p.price})</option>`;
      });
    }

    async function submitPublicBooking() {
      const patient_name = document.getElementById('custName').value;
      const phone_number = document.getElementById('custPhone').value;
      const procedure_id = parseInt(document.getElementById('custProc').value);
      const preferred_date = document.getElementById('custDate').value;
      const preferred_time = document.getElementById('custTime').value;
      const source = document.getElementById('custSource').value;
      const statusDiv = document.getElementById('bookingStatus');

      if (!patient_name || !phone_number || !procedure_id || !preferred_date) {
        alert('Please fill out all booking details!');
        return;
      }

      statusDiv.innerText = "Submitting booking request...";

      try {
        const res = await fetch(`${API_URL}/patients`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ patient_name, phone_number, procedure_id, time_slot: preferred_time, payment_done: 0, discount: 0, next_appointment: preferred_date, source })
        });

        const data = await res.json();
        statusDiv.innerHTML = `✅ Appointment requested successfully! Your OPD Reference Number is <b>${data.opd_number}</b>.`;
      } catch (err) {
        statusDiv.innerText = "❌ Unable to connect to clinic system. Please call 7015070153.";
      }
    }
  </script>
</body>
</html>
